name: 苹果推送服务
description: 让 APNS 相关域名和网段走代理，适用于打开代理工具后 Apple 推送异常的场景
author: IBL3ND
icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png

rules:
  - domain_suffix:
      match: push.apple.com
      policy: iBL3ND
  - domain_suffix:
      match: akadns.net
      policy: iBL3ND
  - domain_keyword:
      match: apple.com.edgekey.net
      policy: iBL3ND
  - ip_cidr:
      match: 17.249.0.0/16
      policy: iBL3ND
      no_resolve: true
  - ip_cidr:
      match: 17.252.0.0/16
      policy: iBL3ND
      no_resolve: true
  - ip_cidr:
      match: 17.57.144.0/22
      policy: iBL3ND
      no_resolve: true
  - ip_cidr:
      match: 17.188.128.0/18
      policy: iBL3ND
      no_resolve: true
  - ip_cidr:
      match: 17.188.20.0/23
      policy: iBL3ND
      no_resolve: true
  - ip_cidr6:
      match: "2620:149:a44::/48"
      policy: iBL3ND
      no_resolve: true
  - ip_cidr6:
      match: "2403:300:a42::/48"
      policy: iBL3ND
      no_resolve: true
  - ip_cidr6:
      match: "2403:300:a51::/48"
      policy: iBL3ND
      no_resolve: true
  - ip_cidr6:
      match: "2a01:b740:a42::/48"
      policy: iBL3ND
      no_resolve: true
