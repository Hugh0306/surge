name: Mirror singbox-lite Surge

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  mirror:
    if: github.event.issue.title == '[internal] mirror singbox surge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror and patch output only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Script
          curl -fL --retry 3 https://raw.githubusercontent.com/0xdabiaoge/singbox-lite/main/singbox.sh -o Script/singbox.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('Script/singbox.sh')
          text = p.read_text(encoding='utf-8')
          start = text.index('_show_node_link() {')
          end = text.index('_show_cdn_guidance() {', start)
          head, fn, tail = text[:start], text[start:end], text[end:]

          def case(label, body):
              global fn
              pat = re.compile(r'(?ms)^        "' + re.escape(label) + r'"\)\n.*?^            ;;')
              fn2, n = pat.subn(body.rstrip(), fn, count=1)
              if n != 1:
                  raise SystemExit(f'patch failed: {label}')
              fn = fn2

          case('trojan-ws-tls', r'''        "trojan-ws-tls")
            # 参数: password, sni, ws_path, skip_verify
            local password="$1" sni="${2:-$DEFAULT_SNI}" ws_path="$3" skip_verify="$4" cert_path="$5"
            url="${name} = trojan, ${link_ip}, ${port}, password=${password}, sni=${sni}, ws=true, ws-path=${ws_path}, ws-headers=Host:${sni}"
            [[ "$skip_verify" == "true" ]] && url+=", skip-cert-verify=true"
            ;;''')

          case('hysteria2', r'''        "hysteria2")
            # 参数: password, sni, obfs_password(可选), port_hopping(可选)
            local password="$1" sni="${2:-$DEFAULT_SNI}" obfs_password="$3" port_hopping="$4"
            url="${name} = hysteria2, ${link_ip}, ${port}, password=${password}, sni=${sni}, skip-cert-verify=true"
            [[ -n "$obfs_password" ]] && url+=", salamander-password=${obfs_password}"
            [[ -n "$port_hopping" ]] && url+=", port-hopping=${port_hopping}"
            ;;''')

          case('tuic', r'''        "tuic")
            # 参数: uuid, password, sni
            local uuid="$1" password="$2" sni="${3:-$DEFAULT_SNI}"
            url="${name} = tuic-v5, ${link_ip}, ${port}, uuid=${uuid}, password=${password}, sni=${sni}, alpn=h3, skip-cert-verify=true"
            ;;''')

          case('anytls', r'''        "anytls")
            # 参数: password, sni, skip_verify
            local password="$1" sni="${2:-$DEFAULT_SNI}" skip_verify="$3" cert_path="$4"
            url="${name} = anytls, ${link_ip}, ${port}, password=${password}, sni=${sni}"
            [[ "$skip_verify" == "true" ]] && url+=", skip-cert-verify=true"
            ;;''')

          case('shadowsocks', r'''        "shadowsocks")
            # 参数: method, password
            local method="$1" password="$2"
            url="${name} = ss, ${link_ip}, ${port}, encrypt-method=${method}, password=${password}, udp-relay=true"
            ;;''')

          case('shadowsocks-shadowtls', r'''        "shadowsocks-shadowtls")
            # 参数: method, pw, spw, sni
            local method="$1" pw="$2" spw="$3" sni="$4"
            url="${name} = ss, ${link_ip}, ${port}, encrypt-method=${method}, password=${pw}, shadow-tls-password=${spw}, shadow-tls-version=3, shadow-tls-sni=${sni}"
            ;;''')

          case('trojan-ws', r'''        "trojan-ws")
            # Argo 专用: password, path
            local password="$1" ws_path="$2"
            local ed_path=$(_ws_path_with_early_data "$ws_path")
            url="${name} = trojan, ${link_ip}, 443, password=${password}, sni=${link_ip}, ws=true, ws-path=${ed_path}, ws-headers=Host:${link_ip}"
            ;;''')

          case('socks', r'''        "socks")
            # 参数: username, password
            local username="$1" password="$2"
            url="${name} = socks5, ${link_ip}, ${port}, ${username}, ${password}, udp-relay=true"
            ;;''')

          p.write_text(head + fn + tail, encoding='utf-8')
          PY
          bash -n Script/singbox.sh

      - name: Commit mirrored script
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mirror-singbox-lite-surge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Script/singbox.sh .github/workflows/mirror-singbox-lite-surge.yml
          git commit -m 'Mirror singbox-lite with Surge-compatible output'
          git push