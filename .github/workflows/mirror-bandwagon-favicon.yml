name: Mirror BandwagonHost favicon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-bandwagon-favicon.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert favicon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Icon
          if ! curl -fL --retry 3 --connect-timeout 10 https://bandwagonhost.com/favicon.ico -o /tmp/bwh-favicon; then
            curl -fL --retry 3 --connect-timeout 10 'https://www.google.com/s2/favicons?domain_url=https://bandwagonhost.com&sz=128' -o /tmp/bwh-favicon
          fi
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          p='/tmp/bwh-favicon'
          im=Image.open(p)
          try:
              n=getattr(im,'n_frames',1)
              if n>1:
                  best=None
                  best_area=-1
                  for i in range(n):
                      im.seek(i)
                      area=im.size[0]*im.size[1]
                      if area>best_area:
                          best=im.convert('RGBA').copy(); best_area=area
                  im=best
              else:
                  im=im.convert('RGBA')
          except Exception:
              im=im.convert('RGBA')
          im.thumbnail((256,256), Image.Resampling.LANCZOS)
          canvas=Image.new('RGBA',(256,256),(0,0,0,0))
          x=(256-im.width)//2; y=(256-im.height)//2
          canvas.alpha_composite(im,(x,y))
          canvas.save('Icon/BandwagonHost.png','PNG',optimize=True)
          PY

      - name: Commit favicon
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/mirror-bandwagon-favicon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Icon/BandwagonHost.png .github/workflows/mirror-bandwagon-favicon.yml
          git commit -m 'Add BandwagonHost favicon for Sub-Store'
          git push
