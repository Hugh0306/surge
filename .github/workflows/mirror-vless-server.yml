name: Mirror vless-server.sh once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mirror-vless-server.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror upstream script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Script
          curl -fL --retry 3 --connect-timeout 15 \
            https://raw.githubusercontent.com/mozisen/surge/main/vless-server.sh \
            -o Script/vless-server.sh
          test -s Script/vless-server.sh
          grep -q '^#!/bin/bash' Script/vless-server.sh
          rm -f .github/workflows/mirror-vless-server.yml

      - name: Commit mirrored file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror vless-server.sh from mozisen/surge"
          git push
