name: Mirror WeatherKit v3.2.0-beta4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mirror-weatherkit-beta4.yml

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and localize release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag='v3.2.0-beta4'
          repo='NSRingo/WeatherKit'
          dst="Module/WeatherKit/${tag}"
          fixed='Module/WeatherKit'
          api="https://api.github.com/repos/${repo}/releases/tags/${tag}"
          upstream="https://github.com/${repo}/releases/download/${tag}"
          self="https://raw.githubusercontent.com/Hugh0306/surge/main/${dst}"

          mkdir -p "$dst" "$fixed"

          curl -LfsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" -o /tmp/weatherkit-release.json

          jq -r '.body // ""' /tmp/weatherkit-release.json > "$dst/RELEASE.md"
          jq -r '.assets[] | [.name,.browser_download_url,(.size|tostring),(.digest // "")] | @tsv' \
            /tmp/weatherkit-release.json > "$dst/assets.tsv"

          while IFS=$'\t' read -r name url size digest; do
            [ -n "$name" ] || continue
            curl -LfsS --retry 3 --retry-delay 2 "$url" -o "$dst/$name"
          done < "$dst/assets.tsv"

          sgmodule="$dst/iRingo.WeatherKit.sgmodule"
          [ -f "$sgmodule" ] || sgmodule="$(find "$dst" -maxdepth 1 -type f -name '*.sgmodule' | head -n 1)"
          [ -n "$sgmodule" ] && [ -f "$sgmodule" ] || { echo 'Surge module asset not found' >&2; exit 1; }

          cp "$sgmodule" "$fixed/WeatherKit.sgmodule"
          for pair in \
            'iRingo.WeatherKit.plugin WeatherKit.plugin' \
            'iRingo.WeatherKit.snippet WeatherKit.snippet' \
            'iRingo.WeatherKit.stoverride WeatherKit.stoverride' \
            'request.bundle.js request.bundle.js' \
            'response.bundle.js response.bundle.js'; do
            set -- $pair
            [ -f "$dst/$1" ] && cp "$dst/$1" "$fixed/$2"
          done

          for file in \
            "$fixed/WeatherKit.sgmodule" \
            "$fixed/WeatherKit.plugin" \
            "$fixed/WeatherKit.snippet" \
            "$fixed/WeatherKit.stoverride"; do
            [ -f "$file" ] || continue
            sed -i "s#${upstream}#${self}#g" "$file"
          done

          sed -i 's#^#!desc =.*$##!desc = WeatherKit 天气增强#' "$fixed/WeatherKit.sgmodule"

          cat > "$fixed/README.md" <<EOF
          # WeatherKit ${tag}

          当前固定入口已更新为 ${tag}。

          - Surge: \`WeatherKit.sgmodule\`
          - Loon: \`WeatherKit.plugin\`
          - Shadowrocket: \`WeatherKit.snippet\`
          - Stash: \`WeatherKit.stoverride\`
          - Scripts: \`request.bundle.js\`, \`response.bundle.js\`

          Release 原始附件保存在 \`${dst}/\`。
          EOF

          rm -f .github/workflows/mirror-weatherkit-beta4.yml

      - name: Commit mirrored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update WeatherKit to v3.2.0-beta4'
          git push
