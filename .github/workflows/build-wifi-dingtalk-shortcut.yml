name: Build WiFi DingTalk Shortcut

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-wifi-dingtalk-shortcut.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create shortcut source
        shell: bash
        run: |
          mkdir -p Shortcut
          cat > /tmp/WiFi-DingTalk.shortcut <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>WFQuickActionSurfaces</key>
            <array/>
            <key>WFWorkflowActions</key>
            <array>
              <dict>
                <key>WFWorkflowActionIdentifier</key>
                <string>is.workflow.actions.url</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>UUID</key>
                  <string>9CE497A6-A7E9-49C4-93E0-7E717C3B30CF</string>
                  <key>WFURLActionURL</key>
                  <string>App-Prefs:root=WIFI</string>
                </dict>
              </dict>
              <dict>
                <key>WFWorkflowActionIdentifier</key>
                <string>is.workflow.actions.openurl</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>WFInput</key>
                  <dict>
                    <key>Value</key>
                    <dict>
                      <key>OutputName</key>
                      <string>URL</string>
                      <key>OutputUUID</key>
                      <string>9CE497A6-A7E9-49C4-93E0-7E717C3B30CF</string>
                      <key>Type</key>
                      <string>ActionOutput</string>
                    </dict>
                    <key>WFSerializationType</key>
                    <string>WFTextTokenAttachment</string>
                  </dict>
                </dict>
              </dict>
              <dict>
                <key>WFWorkflowActionIdentifier</key>
                <string>is.workflow.actions.waittoreturn</string>
                <key>WFWorkflowActionParameters</key>
                <dict/>
              </dict>
              <dict>
                <key>WFWorkflowActionIdentifier</key>
                <string>is.workflow.actions.openapp</string>
                <key>WFWorkflowActionParameters</key>
                <dict>
                  <key>WFAppIdentifier</key>
                  <string>com.laiwang.DingTalk</string>
                  <key>WFSelectedApp</key>
                  <dict>
                    <key>BundleIdentifier</key>
                    <string>com.laiwang.DingTalk</string>
                    <key>Name</key>
                    <string>钉钉</string>
                  </dict>
                </dict>
              </dict>
            </array>
            <key>WFWorkflowClientVersion</key>
            <string>3612.0.1.2</string>
            <key>WFWorkflowHasOutputFallback</key>
            <false/>
            <key>WFWorkflowHasShortcutInputVariables</key>
            <false/>
            <key>WFWorkflowIcon</key>
            <dict>
              <key>WFWorkflowIconGlyphNumber</key>
              <integer>59511</integer>
              <key>WFWorkflowIconStartColor</key>
              <integer>4271458815</integer>
            </dict>
            <key>WFWorkflowImportQuestions</key>
            <array/>
            <key>WFWorkflowInputContentItemClasses</key>
            <array/>
            <key>WFWorkflowMinimumClientVersion</key>
            <integer>900</integer>
            <key>WFWorkflowMinimumClientVersionString</key>
            <string>900</string>
            <key>WFWorkflowOutputContentItemClasses</key>
            <array/>
            <key>WFWorkflowTypes</key>
            <array/>
          </dict>
          </plist>
          PLIST
          plutil -lint /tmp/WiFi-DingTalk.shortcut

      - name: Sign shortcut
        shell: bash
        run: |
          shortcuts sign --mode anyone --input /tmp/WiFi-DingTalk.shortcut --output Shortcut/WiFi-DingTalk.shortcut
          test -s Shortcut/WiFi-DingTalk.shortcut

      - name: Commit signed shortcut
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Shortcut/WiFi-DingTalk.shortcut
          git rm .github/workflows/build-wifi-dingtalk-shortcut.yml
          git commit -m "Add signed Wi-Fi DingTalk shortcut"
          git push
